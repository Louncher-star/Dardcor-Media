<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <title>Tidak ada koneksi - Dardcor Media</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0f0d19;
        color: #f5f3ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        text-align: center;
      }

      .card {
        max-width: 380px;
        width: 100%;
        background: #151221;
        border: 1px solid #2c2543;
        border-radius: 24px;
        padding: 36px 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }

      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 30px;
        color: #fff;
        background: linear-gradient(135deg, #6d28d9, #a855f7);
      }

      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }

      p {
        font-size: 14px;
        line-height: 1.6;
        color: #a78bfa;
        margin: 0 0 24px;
      }

      button {
        width: 100%;
        padding: 13px 18px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, #7c3aed, #9333ea);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">D</div>
      <h1>Tidak ada koneksi internet</h1>
      <p>
        Dardcor Media membutuhkan koneksi untuk mengirim dan menerima pesan. Periksa jaringan
        Anda, lalu coba lagi.
      </p>
      <button onclick="window.location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
